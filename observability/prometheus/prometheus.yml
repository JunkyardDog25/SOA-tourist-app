global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: tour-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - tour-service:8084
        labels:
          service: tour-service

  - job_name: auth-service
    metrics_path: /api/auth/actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8080
        labels:
          service: auth-service

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: cadvisor

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node-exporter
          host_layer: docker-wsl

  - job_name: windows-exporter
    static_configs:
      - targets:
          - host.docker.internal:9182
        labels:
          service: windows-exporter
          host_layer: windows-host
